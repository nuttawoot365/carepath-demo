<title>CarePath คิว A-017</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #1f6f8b;
    --primary-ink: #14556d;
    --primary-soft: #e4f0f4;
    --warn: #c8552f;
    --warn-soft: #fbeae3;
    --amber: #b8791a;
    --amber-soft: #fbf1df;
    --success: #2e8b57;
    --success-soft: #e4f2ea;

    --ground: #f6f9fa;
    --surface: #ffffff;
    --raised: #fbfdfd;
    --ink: #10222a;
    --ink-2: #4c626c;
    --ink-3: #7c9099;
    --line: #dbe5e9;
    --line-strong: #c3d2d8;

    --bar-bg: #ffffffd9;
    --shadow-1: 0 1px 2px rgba(16, 34, 42, .07);
    --shadow-2: 0 2px 6px rgba(16, 34, 42, .07), 0 14px 32px rgba(16, 34, 42, .09);

    --r-sm: 10px;
    --r: 14px;
    --r-lg: 20px;
    --tap: 48px;
    --step: 1;

    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #5cabc4;
      --primary-ink: #9ed2e3;
      --primary-soft: #14313c;
      --warn: #ef8e6b;
      --warn-soft: #3a1f16;
      --amber: #e0a84a;
      --amber-soft: #382a12;
      --success: #62bf8d;
      --success-soft: #16311f;

      --ground: #0d171c;
      --surface: #15242b;
      --raised: #1a2c34;
      --ink: #e8f0f3;
      --ink-2: #a5bac3;
      --ink-3: #74909b;
      --line: #273b44;
      --line-strong: #375059;

      --bar-bg: #15242bd9;
      --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
      --shadow-2: 0 2px 6px rgba(0, 0, 0, .35), 0 14px 32px rgba(0, 0, 0, .45);

      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --primary: #5cabc4;
    --primary-ink: #9ed2e3;
    --primary-soft: #14313c;
    --warn: #ef8e6b;
    --warn-soft: #3a1f16;
    --amber: #e0a84a;
    --amber-soft: #382a12;
    --success: #62bf8d;
    --success-soft: #16311f;

    --ground: #0d171c;
    --surface: #15242b;
    --raised: #1a2c34;
    --ink: #e8f0f3;
    --ink-2: #a5bac3;
    --ink-3: #74909b;
    --line: #273b44;
    --line-strong: #375059;

    --bar-bg: #15242bd9;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 2px 6px rgba(0, 0, 0, .35), 0 14px 32px rgba(0, 0, 0, .45);

    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    /* Sarabun ครอบคลุมไทยและละติน · Noto รับช่วงจีน เมียนมา และซีริลลิก */
    font-family: Sarabun, 'Noto Sans', 'Noto Sans SC', 'Noto Sans Myanmar',
                 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: calc(16px * var(--step));
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  /* ภาษาที่ตัวอักษรสูงกว่าไทยต้องการบรรทัดที่หายใจได้มากขึ้น */
  body[data-lang="my"] { line-height: 1.85; }
  body[data-lang="zh"] { line-height: 1.7; }
  body[data-large="on"] { --step: 1.35; }

  h1, h2, h3, p, ul, ol { margin: 0; }
  ul, ol { padding: 0; list-style: none; }
  button { font: inherit; color: inherit; }

  .mono {
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- โครงหน้าจอ ---------- */

  .phone {
    max-width: 460px;
    min-height: 100dvh;
    margin: 0 auto;
    background: var(--ground);
    display: flex;
    flex-direction: column;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--bar-bg);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }

  .ticket { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .ticket b {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.22em;
    letter-spacing: .04em;
  }
  .ticket span {
    font-size: .78em;
    color: var(--ink-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .topbar__tools { margin-inline-start: auto; display: flex; gap: 6px; flex: none; }

  .chip {
    min-height: 38px;
    min-width: 44px;
    padding: 4px 11px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink-2);
    font-size: .82em;
    font-weight: 600;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    border-color: var(--primary);
    background: var(--primary-soft);
    color: var(--primary-ink);
  }

  .scroll {
    flex: 1;
    padding: 14px 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .actionbar {
    position: sticky;
    bottom: 0;
    z-index: 20;
    display: flex;
    gap: 10px;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: var(--bar-bg);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
  }

  /* ---------- ส่วนประกอบ ---------- */

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 15px;
    box-shadow: var(--shadow-1);
  }

  .eyebrow {
    font-size: .76em;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .alert {
    display: flex;
    gap: 11px;
    padding: 13px 15px;
    border-radius: var(--r);
    border: 1px solid;
    align-items: flex-start;
  }
  .alert__icon { font-size: 1.3em; line-height: 1.2; flex: none; }
  .alert--amber { background: var(--amber-soft); border-color: var(--amber); }
  .alert--warn { background: var(--warn-soft); border-color: var(--warn); }
  .alert b { display: block; color: var(--ink); }
  .alert p { font-size: .92em; color: var(--ink-2); }

  .hero {
    background: var(--surface);
    border: 2px solid var(--primary);
    border-radius: var(--r-lg);
    padding: 18px;
    box-shadow: var(--shadow-2);
  }
  .hero__row { display: flex; align-items: center; gap: 15px; }
  .hero__icon {
    width: calc(60px * var(--step));
    height: calc(60px * var(--step));
    display: grid;
    place-items: center;
    flex: none;
    border-radius: 18px;
    background: var(--primary-soft);
    font-size: 1.9em;
  }
  .hero__name { font-size: 1.45em; font-weight: 800; line-height: 1.25; text-wrap: balance; }
  .hero__at { color: var(--ink-2); font-size: .92em; }
  .hero__walk {
    margin-top: 13px;
    padding-top: 12px;
    border-top: 1px dashed var(--line-strong);
    display: flex;
    gap: 18px;
  }
  .metric { display: flex; flex-direction: column; line-height: 1.15; }
  .metric b { font-family: 'IBM Plex Mono', monospace; font-size: 1.22em; font-variant-numeric: tabular-nums; }
  .metric span { font-size: .76em; color: var(--ink-3); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: var(--tap);
    padding: 11px 18px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--surface);
    font-weight: 700;
    cursor: pointer;
    transition: transform .08s ease, background-color .15s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn--primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn--success { background: var(--success); border-color: var(--success); color: #fff; }
  .btn--grow { flex: 1; }
  .btn--lg { min-height: 56px; font-size: 1.06em; }
  :root[data-theme="dark"] .btn--primary,
  :root[data-theme="dark"] .btn--success { color: #08171d; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .btn--primary,
    :root:not([data-theme="light"]) .btn--success { color: #08171d; }
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: .76em;
    font-weight: 700;
    white-space: nowrap;
    background: var(--primary-soft);
    color: var(--primary-ink);
  }
  .tag--amber { background: var(--amber-soft); color: var(--amber); }
  .tag--success { background: var(--success-soft); color: var(--success); }
  .tag--muted { background: var(--raised); color: var(--ink-3); border: 1px solid var(--line); }

  /* ---------- ภาพรวมเส้นทางทั้งวัน ---------- */

  .overview { display: flex; flex-direction: column; gap: 10px; }
  .overview svg { display: block; width: 100%; height: auto; overflow: visible; }
  .overview__facts { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82em; color: var(--ink-2); }
  .ov-floor { stroke: var(--line); stroke-width: 1; }
  .ov-floor-label { fill: var(--ink-3); font-size: 9px; font-weight: 700; }
  .ov-building { fill: var(--ink-3); font-size: 9px; font-weight: 700; letter-spacing: .08em; }
  .ov-split { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 4; }
  .ov-line { fill: none; stroke: var(--primary); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .ov-line--done { stroke: var(--success); }
  .ov-node { fill: var(--surface); stroke: var(--line-strong); stroke-width: 2; }
  .ov-node--done { fill: var(--success); stroke: var(--success); }
  .ov-node--now { fill: var(--primary); stroke: var(--primary); }
  .ov-icon { font-size: 11px; }

  /* ---------- รายการขั้นตอน ---------- */

  .progress { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; }
  .progress b { font-size: 1.05em; }
  .progress span { color: var(--ink-3); font-size: .85em; margin-inline-start: auto; }

  .rail { display: flex; gap: 4px; }
  .rail i { height: 5px; flex: 1; border-radius: 3px; background: var(--line); }
  .rail i[data-on="done"] { background: var(--success); }
  .rail i[data-on="now"] { background: var(--primary); }

  .steps { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
  .step {
    display: grid;
    grid-template-columns: auto auto 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--raised);
  }
  .step--done { background: var(--success-soft); border-color: transparent; }
  .step--done .step__name { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--ink-3); }
  .step--now { background: var(--surface); border: 2px solid var(--primary); }
  .step__no {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--line);
    color: var(--ink-2);
    font-family: 'IBM Plex Mono', monospace;
    font-size: .8em;
    font-weight: 700;
  }
  .step--done .step__no { background: var(--success); color: #fff; }
  .step--now .step__no { background: var(--primary); color: #fff; }
  .step__icon { font-size: 1.25em; }
  .step__name { font-weight: 600; line-height: 1.35; }
  .step__where { font-size: .78em; color: var(--ink-3); }

  /* ---------- เส้นทาง ---------- */

  .routehead {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 15px;
    border-radius: var(--r);
    background: var(--primary-soft);
    border: 1px solid var(--primary);
  }

  .route { display: flex; flex-direction: column; gap: 9px; }
  .leg {
    display: grid;
    grid-template-columns: calc(48px * var(--step)) 1fr;
    align-items: center;
    gap: 13px;
    padding: 13px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--surface);
  }
  .leg--current { border: 2px solid var(--primary); box-shadow: var(--shadow-2); }
  .leg--past { opacity: .5; }
  .leg__arrow { font-size: 1.9em; text-align: center; line-height: 1; }
  .leg__text { font-weight: 700; line-height: 1.4; text-wrap: balance; }
  .leg__sub { display: block; font-size: .84em; color: var(--ink-2); margin-top: 2px; }
  .leg__dist {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .76em;
    color: var(--ink-3);
    margin-top: 4px;
  }

  .solo { text-align: center; padding: 26px 18px; }
  .solo .leg__arrow { font-size: 3.4em; margin-bottom: 6px; }
  .solo .leg__text { font-size: 1.3em; }
  .solo__count { font-family: 'IBM Plex Mono', monospace; font-size: .8em; color: var(--ink-3); letter-spacing: .06em; }

  /* ---------- แผ่นเลื่อนขึ้น ---------- */

  dialog {
    width: min(460px, 100%);
    margin: auto auto 0;
    padding: 0;
    border: none;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-2);
  }
  dialog::backdrop { background: rgba(6, 18, 23, .55); }
  .sheet {
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 82dvh;
    overflow-y: auto;
  }
  .sheet__grip { width: 42px; height: 4px; border-radius: 3px; background: var(--line-strong); margin: 0 auto 2px; flex: none; }
  .sheet h2 { font-size: 1.1em; }

  .pick {
    display: flex;
    align-items: center;
    gap: 11px;
    width: 100%;
    min-height: var(--tap);
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--raised);
    text-align: start;
    cursor: pointer;
  }
  .pick--on { border-color: var(--primary); background: var(--primary-soft); }
  .pick b { font-weight: 600; }
  .pick span { display: block; font-size: .78em; color: var(--ink-3); }
  .pick__icon { font-size: 1.3em; flex: none; }
  .pick__tick { margin-inline-start: auto; color: var(--primary); font-weight: 700; }

  /* ---------- แผงเดโม ---------- */

  .demo-open {
    position: fixed;
    inset-block-end: calc(76px + env(safe-area-inset-bottom));
    inset-inline-end: max(14px, calc(50% - 216px));
    z-index: 30;
    min-height: 46px;
    padding: 9px 15px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    box-shadow: var(--shadow-2);
    font-size: .85em;
    font-weight: 700;
    cursor: pointer;
  }

  .demo-note { font-size: .8em; color: var(--ink-3); line-height: 1.6; }

  .toast {
    position: fixed;
    inset-block-start: 68px;
    inset-inline: 0;
    z-index: 40;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }
  .toast div {
    max-width: 92%;
    padding: 10px 16px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--ground);
    font-size: .86em;
    font-weight: 600;
    box-shadow: var(--shadow-2);
    animation: rise .28s ease;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(-8px); } }

  .fade { animation: fade .22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }

  :where(button, [tabindex]):focus-visible {
    outline: 3px solid var(--primary);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }


  /* ---------- รูปของจุดหมาย ---------- */

  .photo {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: var(--r);
    border: 1px solid var(--line);
    background: var(--raised);
  }

  .photo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: var(--tap);
    margin-top: 10px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--raised);
    cursor: pointer;
    text-align: start;
  }
  .photo-row img {
    width: 58px; height: 44px; flex: none;
    object-fit: cover;
    border-radius: 7px;
    border: 1px solid var(--line-strong);
  }
  .photo-row b { font-weight: 700; font-size: .9em; }
  .photo-row small { display: block; font-size: .76em; color: var(--ink-3); }

  .photo-leg {
    display: inline-flex; align-items: center; gap: 7px;
    margin-top: 8px; padding: 5px 10px 5px 5px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--raised);
    font-size: .78em; font-weight: 700;
    cursor: pointer;
  }
  .photo-leg img { width: 30px; height: 24px; object-fit: cover; border-radius: 5px; }

  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .gallery button {
    padding: 0; overflow: hidden; cursor: pointer;
    border: 1px solid var(--line); border-radius: var(--r-sm);
    background: var(--raised); text-align: start;
  }
  .gallery img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  .gallery b { display: block; padding: 7px 9px 2px; font-size: .84em; line-height: 1.35; }
  .gallery small { display: block; padding: 0 9px 8px; font-size: .74em; color: var(--ink-3); }
  .gallery .dot { color: var(--success); }

  .group-label {
    margin-top: 4px;
    font-size: .78em; font-weight: 700; letter-spacing: .06em;
    color: var(--ink-3); text-transform: uppercase;
  }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 999px;
    font-size: .76em; font-weight: 700;
  }
  .badge--sample { background: var(--amber-soft); color: var(--amber); }
  .badge--real { background: var(--success-soft); color: var(--success); }

  .done-screen { text-align: center; padding: 34px 18px; }
  .done-screen .hero__icon { margin: 0 auto 14px; background: var(--success-soft); }
</style>

<div class="phone">
  <header class="topbar">
    <div class="ticket">
      <b class="mono">A-017</b>
      <span id="who"></span>
    </div>
    <div class="topbar__tools">
      <button class="chip" id="langBtn" aria-haspopup="dialog">🌐 <span id="langCode">ไทย</span></button>
      <button class="chip" id="largeBtn" aria-pressed="false" aria-label="Large text">ก+</button>
    </div>
  </header>

  <main class="scroll" id="view"></main>

  <footer class="actionbar" id="actions"></footer>
</div>

<button class="demo-open" id="demoBtn">🎬 <span id="demoLabel"></span></button>
<div class="toast" id="toast" aria-live="polite"></div>

<input type="file" id="photoFile" accept="image/*" capture="environment" hidden>
<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>

<script>
(() => {
  'use strict';

  /* ==========================================================================
     ภาษา
     เพิ่มประเทศใหม่ = เพิ่มหนึ่งรายการใน LANGS และหนึ่งชุดใน DICT + PLACES
     ไม่ต้องแตะข้อมูลเส้นทางเลย เพราะประโยคนำทางประกอบจากแม่แบบข้างล่าง
     ========================================================================== */

  const LANGS = [
    { code: 'th', native: 'ไทย',      label: 'Thai',    flag: '🇹🇭', speech: 'th-TH', short: 'ไทย' },
    { code: 'en', native: 'English',  label: 'อังกฤษ',  flag: '🇬🇧', speech: 'en-US', short: 'EN' },
    { code: 'zh', native: '中文',      label: 'จีน',     flag: '🇨🇳', speech: 'zh-CN', short: '中文' },
    { code: 'my', native: 'မြန်မာ',   label: 'เมียนมา', flag: '🇲🇲', speech: 'my-MM', short: 'မြန်မာ' },
    { code: 'ru', native: 'Русский',  label: 'รัสเซีย', flag: '🇷🇺', speech: 'ru-RU', short: 'RU' },
  ];

  const CAPITALISED = new Set(['en', 'ru']);   // ภาษาที่ขึ้นต้นประโยคด้วยตัวใหญ่

  const DICT = {

  const SCENE_PAINTERS = {
    counter: (...args) => drawCounter(...args), door: (...args) => drawDoor(...args),
    seats: (...args) => drawSeats(...args), lift: (...args) => drawLift(...args),
    ramp: (...args) => drawRamp(...args), bridge: (...args) => drawBridge(...args),

  };

  const W = 800;
  const H = 600;
  const HORIZON = 330;
  const sceneCache = new Map();

  const roundRect = (ctx, x, y, w, h, r) => {
    ctx.beginPath();
    if (typeof ctx.roundRect === 'function') ctx.roundRect(x, y, w, h, r);

  };

  function sampleScene(code) {
    const key = `${code}|${state.lang}`;
    if (sceneCache.has(key)) return sceneCache.get(key);

    const scene = SCENES[code] ?? { kind: 'door', color: '#1f6f8b' };
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    drawRoom(ctx);
    SCENE_PAINTERS[scene.kind](ctx, scene);
    if (scene.prop === 'water') drawWaterDispenser(ctx);
    if (scene.prop === 'plant') drawPlant(ctx);
    drawSign(ctx, scene, code);
    drawDisclaimer(ctx);

    const url = canvas.toDataURL('image/jpeg', 0.82);
    sceneCache.set(key, url);
    return url;
  }

  function drawRoom(ctx) {
    ctx.fillStyle = '#f4f7f8';                       // เพดาน
    ctx.fillRect(0, 0, W, 96);
    ctx.fillStyle = '#e8edef';                       // ผนังด้านหลัง
    ctx.fillRect(0, 96, W, HORIZON - 96);
    ctx.fillStyle = '#d9d3c9';                       // พื้น
    ctx.fillRect(0, HORIZON, W, H - HORIZON);

    ctx.fillStyle = '#dfe5e8';                       // ผนังข้าง
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(120, 96); ctx.lineTo(120, HORIZON); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(W - 120, 96); ctx.lineTo(W - 120, HORIZON); ctx.lineTo(W, H); ctx.closePath(); ctx.fill();

    ctx.strokeStyle = '#cfc8bd';                     // เส้นพื้นเข้าหาจุดรวมสายตา
    ctx.lineWidth = 2;
    for (let i = -3; i <= 3; i += 1) {

  /** ย่อภาพก่อนเก็บ เพราะพื้นที่ในเครื่องมีจำกัด */
  function shrink(file, maxSide = 1000) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const image = new Image();
        image.onerror = reject;
        image.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(image.width * scale);
          canvas.height = Math.round(image.height * scale);
          canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function legArrow(leg) {
    if (leg.act === 'bridge') return ARROW.bridge;
    if (leg.act === 'lift' || leg.act === 'ramp') return ARROW[leg.dir];
    return ARROW[leg.turn] ?? ARROW.straight;
  }

  function legIcon(leg) {
    if (leg.arrive) return PLACES[leg.arrive].icon;
    if (leg.act === 'lift') return '🛗';

    if (leg.act === 'bridge') return '🌉';

  function legText(leg) {
    const join = DICT[state.lang].join;

    if (leg.act === 'lift' || leg.act === 'ramp') {
      return sentenceCase(t(`${leg.act}_${leg.dir}`, { name: placeName(leg.name), floor: leg.floor }));
    }
    if (leg.act === 'bridge') {
      return sentenceCase(t('bridge', { building: leg.building, floor: leg.floor }));
    }

    const parts = [t(`turn.${leg.turn}`)];
    if (leg.turn !== 'straight' || leg.m > 0) parts.push(t('walk', { m: leg.m }));
    if (leg.to) parts.push(t('toward', { to: placeName(leg.to) }));
    if (leg.arrive) parts.push(t(`arrive_${leg.side}`, { name: placeName(leg.arrive) }));

    return sentenceCase(parts.join(join));

  /**
   * ภาพรวมทั้งวันแบบย่อ: แกนตั้งคือชั้น แกนนอนคือลำดับขั้น
   * ตอบคำถามที่ผู้ป่วยถามจริง — วันนี้ต้องขึ้นลงกี่รอบ ข้ามตึกกี่ครั้ง
   */
  function journeyChart() {
    const steps = state.steps;
    const target = nextStep();
    const floors = [...new Set(steps.map((step) => PLACES[step.point].floor))].sort((a, b) => b - a);

    const W = 320;
    const H = 34 + floors.length * 26;
    const left = 30;
    const gap = steps.length > 1 ? (W - left - 16) / (steps.length - 1) : 0;

    const at = (step, index) => ({
      x: left + index * gap,
      y: 16 + floors.indexOf(PLACES[step.point].floor) * 26,
    });

    const points = steps.map(at);
    const doneCount = steps.filter((step) => step.status === 'done').length;

    const rows = floors.map((floor, i) => `
      <line class="ov-floor" x1="${left - 8}" y1="${16 + i * 26}" x2="${W}" y2="${16 + i * 26}"/>
      <text class="ov-floor-label" x="0" y="${19 + i * 26}">${esc(t('floorShort', { n: floor }))}</text>`).join('');

    const splits = steps.slice(1).map((step, i) =>
      PLACES[step.point].building === PLACES[steps[i].point].building ? '' : `
        <line class="ov-split" x1="${(points[i].x + points[i + 1].x) / 2}" y1="4"
              x2="${(points[i].x + points[i + 1].x) / 2}" y2="${H - 16}"/>
        <text class="ov-building" x="${(points[i].x + points[i + 1].x) / 2 + 3}" y="${H - 4}">${esc(PLACES[step.point].building)}</text>`).join('');

    const line = (from, to, cls) => {
      const slice = points.slice(from, to);
      return slice.length < 2 ? '' :
        `<polyline class="ov-line ${cls}" points="${slice.map((p) => `${p.x},${p.y}`).join(' ')}"/>`;
    };

    const dots = steps.map((step, i) => {
      const cls = step.status === 'done' ? 'ov-node--done' : step === target ? 'ov-node--now' : '';
      return `<circle class="ov-node ${cls}" cx="${points[i].x}" cy="${points[i].y}" r="${step === target ? 7 : 5}"/>
              <text class="ov-icon" x="${points[i].x}" y="${points[i].y - 11}" text-anchor="middle">${PLACES[step.point].icon}</text>`;
    }).join('');

    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('overviewTitle'))}">
      ${rows}${splits}
      ${line(0, Math.max(doneCount, 1), 'ov-line--done')}
      ${line(Math.max(doneCount - 1, 0), steps.length, '')}
      ${dots}
    </svg>`;
  }

  /** จำนวนครั้งที่ต้องเปลี่ยนชั้นและข้ามอาคารตลอดทั้งวัน */
  function journeyCounts() {
    let floors = 0;
    let buildings = 0;
    state.steps.slice(1).forEach((step, i) => {
      const from = PLACES[state.steps[i].point];
      const to = PLACES[step.point];
      if (from.floor !== to.floor) floors += 1;
      if (from.building !== to.building) buildings += 1;
    });
    return { floors, buildings };
  }

  const railMark = (step, target) =>
    `<i data-on="${step.status === 'done' ? 'done' : step === target ? 'now' : ''}"></i>`;

  function stepHtml(step, index, target) {
    const place = PLACES[step.point];
    const isNow = step === target;
    const cls = step.status === 'done' ? 'step step--done' : isNow ? 'step step--now' : 'step';
    const tail = step.status === 'done'
      ? `<span class="tag tag--success mono">${esc(step.at ?? t('doneAt'))}</span>`
      : step.deadline ? `<span class="tag tag--amber">${esc(t('deadlineTag'))}</span>`
      : step.added ? `<span class="tag">${esc(t('added'))}</span>`
      : '';

    return `
      <li class="${cls}">
        <span class="step__no">${step.status === 'done' ? '✓' : index + 1}</span>
        <span class="step__icon" aria-hidden="true">${place.icon}</span>
        <span>
          <span class="step__name">${esc(step[state.lang])}</span><br>
          <span class="step__where">${esc(placeAt(step.point))} · ${esc(placeName(step.point))}</span>
        </span>
        ${tail}
      </li>`;
  }

  function renderRoute(target) {
    const route = currentRoute();
    const totals = routeTotals(route);
    state.leg = Math.min(state.leg, route.length - 1);

    el.view.className = 'scroll fade';
    el.view.innerHTML = `
      ${state.rerouteOpen ? alertHtml('warn', '🔔', t('rerouteTitle'), t('rerouteBody')) : ''}

      <section class="routehead">
        <div class="hero__icon" style="width:52px;height:52px;font-size:1.6em" aria-hidden="true">${PLACES[target.point].icon}</div>
        <div>
          <p class="eyebrow">${esc(t('routeTo'))}</p>
          <h2 style="font-size:1.2em;font-weight:800;line-height:1.25">${esc(placeName(target.point))}</h2>
          <p class="mono" style="font-size:.84em;color:var(--ink-2)">${totals.m} ${esc(t('meters'))} · ${totals.min} ${esc(t('minutes'))}</p>
        </div>
      </section>

      <div style="display:flex;gap:9px">
        <button class="btn btn--grow" data-act="mode">${state.solo ? '☰ ' + esc(t('listMode')) : '1️⃣ ' + esc(t('soloMode'))}</button>
        <button class="btn" data-act="speak" aria-label="${esc(t('readAloud'))}">🔊</button>
      </div>

      <ol class="route">
        ${state.solo ? soloHtml(route[state.leg], state.leg, route.length) : route.map(legHtml).join('')}
      </ol>

      <button class="btn" data-act="where">🙋 ${esc(t('lost'))}</button>
      <p class="demo-note">${esc(t('lostHelp'))}</p>
    `;

    el.actions.innerHTML = state.solo && state.leg < route.length - 1
      ? `<button class="btn" data-act="prevleg">← ${esc(t('prev'))}</button>
         <button class="btn btn--primary btn--grow btn--lg" data-act="nextleg">${esc(t('next'))} →</button>`
      : `<button class="btn btn--grow" data-act="steps">☰ ${esc(t('backSteps'))}</button>
         <button class="btn btn--success btn--grow btn--lg" data-act="arrive">✔ ${esc(t('arrived'))}</button>`;
  }

  function legHtml(leg, index) {
    const cls = index === state.leg ? ' leg--current' : index < state.leg ? ' leg--past' : '';
    const icon = legIcon(leg);
    return `
      <li class="leg${cls}">
        <span class="leg__arrow" aria-hidden="true">${legArrow(leg)}</span>
        <span>
          <span class="leg__text">${icon ? icon + ' ' : ''}${esc(legText(leg))}</span>
          ${legHint(leg) ? `<span class="leg__sub">${esc(legHint(leg))}</span>` : ''}
          ${leg.m ? `<span class="leg__dist">${leg.m} ${esc(t('meters'))}</span>` : ''}
          ${photoChipHtml(leg.arrive ?? leg.to ?? leg.name)}
        </span>
      </li>`;
  }

  const soloHtml = (leg, index, total) => `
    <li class="leg leg--current solo">
      <p class="solo__count">${esc(t('of', { a: index + 1, b: total }))}</p>
      <p class="leg__arrow" aria-hidden="true">${legArrow(leg)}</p>
      <p class="leg__text">${legIcon(leg) ? legIcon(leg) + ' ' : ''}${esc(legText(leg))}</p>
      ${legHint(leg) ? `<p class="leg__sub">${esc(legHint(leg))}</p>` : ''}
      ${leg.m ? `<p class="leg__dist">${leg.m} ${esc(t('meters'))}</p>` : ''}
      ${photoChipHtml(leg.arrive ?? leg.to ?? leg.name)}
    </li>`;

  const alertHtml = (kind, icon, title, body) => `
    <div class="alert alert--${kind}" role="status">
      <span class="alert__icon" aria-hidden="true">${icon}</span>
      <span><b>${esc(title)}</b><p>${esc(body)}</p></span>
    </div>`;

  function renderDone() {
    el.view.className = 'scroll fade';
    el.view.innerHTML = `
      <section class="card done-screen">
        <div class="hero__icon" aria-hidden="true">✅</div>
        <h2 class="hero__name">${esc(t('allDone'))}</h2>
        <p style="color:var(--ink-2);margin-top:8px">${esc(t('allDoneBody'))}</p>
      </section>
      <section class="card">
        <div class="rail">${state.steps.map(() => '<i data-on="done"></i>').join('')}</div>
        <ol class="steps">${state.steps.map((step, i) => stepHtml(step, i, null)).join('')}</ol>
      </section>`;
    el.actions.innerHTML = `<button class="btn btn--grow btn--lg" data-act="reset">↻ ${esc(t('demoReset'))}</button>`;
  }

  /* ==========================================================================
     แผ่นเลื่อนขึ้นและการกระทำ
     ========================================================================== */

  /* ---------- ส่วนแสดงรูปของจุด ---------- */

  function photoRowHtml(code) {
    if (!code) return '';
    const photo = photoOf(code);
    return `
      <button class="photo-row" data-act="photo" data-code="${code}">
        <img src="${photo.src}" alt="">
        <span style="flex:1">
          <b>📷 ${esc(t('photoView'))}</b>
          <small>${esc(photo.real ? t('photoTitle') : 'ภาพจำลอง · illustration')}</small>
        </span>
        <span aria-hidden="true">›</span>
      </button>`;
  }

  function photoChipHtml(code) {
    if (!code || !PLACES[code]) return '';
    return `
      <button class="photo-leg" data-act="photo" data-code="${code}">
        <img src="${photoOf(code).src}" alt="">${esc(t('photoView'))}
      </button>`;
  }

  /** รูปทุกจุดในผัง จัดกลุ่มตามอาคารและชั้น */
  function gallerySheet() {
    const groups = new Map();
    for (const code of Object.keys(SCENES)) {
      const label = placeAt(code);
      if (!groups.has(label)) groups.set(label, []);
      groups.get(label).push(code);
    }

    openSheet(`
      <h2>${esc(t('galleryTitle'))}</h2>
      <p class="demo-note">${esc(t('galleryHint'))}</p>
      ${[...groups].sort(([a], [b]) => a.localeCompare(b)).map(([label, codes]) => `
        <p class="group-label">${esc(label)}</p>
        <div class="gallery">
          ${codes.map((code) => `
            <button data-act="photo" data-code="${code}">
              <img src="${photoOf(code).src}" alt="">
              <b>${PLACES[code].icon} ${esc(placeName(code))}</b>
              <small>${userPhotos[code]
                ? `<span class="dot">●</span> ${esc(t('photoTitle'))}`
                : 'ภาพจำลอง · illustration'}</small>
            </button>`).join('')}
        </div>`).join('')}
      <button class="btn" data-act="closesheet">${esc(t('close'))}</button>`);
  }

  function photoSheet(code) {
    const photo = photoOf(code);
    openSheet(`
      <h2>${esc(placeName(code))}</h2>
      <p class="demo-note">${esc(placeAt(code))}</p>
      <img class="photo" src="${photo.src}" alt="${esc(t('photoTitle'))} — ${esc(placeName(code))}">
      <p><span class="badge ${photo.real ? 'badge--real' : 'badge--sample'}">
        ${photo.real ? '📷 ' + esc(t('photoTitle')) : '✏️ ภาพจำลอง · illustration'}
      </span></p>
      <p class="demo-note">${esc(t('photoHint'))}<br>${esc(t('photoStored'))}</p>
      <button class="pick" data-act="shoot" data-code="${code}">
        <span class="pick__icon">📷</span>
        <span><b>${esc(photo.real ? t('photoRetake') : t('photoAdd'))}</b></span>
      </button>
      ${photo.real ? `<button class="pick" data-act="dropphoto" data-code="${code}">
        <span class="pick__icon">🗑</span><span><b>${esc(t('photoRemove'))}</b></span></button>` : ''}
      <button class="pick" data-act="gallery">
        <span class="pick__icon">🏥</span><span><b>${esc(t('galleryOpen'))}</b></span></button>
      <button class="btn" data-act="closesheet">${esc(t('close'))}</button>`);
  }

  function openSheet(html) {
    el.sheetBody.innerHTML = `<div class="sheet__grip"></div>${html}`;
    el.sheet.showModal();
  }

  const langSheet = () => openSheet(`
    <h2>${esc(t('langTitle'))}</h2>
    <p class="demo-note">${esc(t('langHint'))}</p>
    ${LANGS.map((lang) => `
      <button class="pick${lang.code === state.lang ? ' pick--on' : ''}" data-act="setlang" data-code="${lang.code}">
        <span class="pick__icon" aria-hidden="true">${lang.flag}</span>
        <span><b>${esc(lang.native)}</b><span>${esc(lang.label)}</span></span>
        ${lang.code === state.lang ? '<span class="pick__tick">✓</span>' : ''}
      </button>`).join('')}
    <button class="btn" data-act="closesheet">${esc(t('close'))}</button>`);

  /**
   * ผู้ป่วยที่หลงต้องเลือกจากสิ่งที่ "มองเห็น" ไม่ใช่จากชื่อที่อ่านไม่ออก
   * แผ่นนี้จึงเป็นตารางรูป จุดที่คนมักยืนอยู่ขึ้นก่อน แล้วตามด้วยที่เหลือแยกตามอาคารและชั้น
   */
  function whereSheet() {
    const rest = Object.keys(SCENES).filter((code) => !NEARBY.includes(code));
    const groups = new Map();
    for (const code of rest) {
      const label = placeAt(code);
      if (!groups.has(label)) groups.set(label, []);
      groups.get(label).push(code);
    }

    openSheet(`
      <h2>${esc(t('pickTitle'))}</h2>
      <p class="demo-note">${esc(t('pickHint'))}</p>

      <p class="group-label">${esc(t('pickNearby'))}</p>
      <div class="gallery">${NEARBY.map(placeTile).join('')}</div>

      <p class="group-label" style="margin-top:10px">${esc(t('pickAll'))}</p>
      ${[...groups].sort(([a], [b]) => a.localeCompare(b)).map(([label, codes]) => `
        <p class="group-label" style="font-weight:400;letter-spacing:0;text-transform:none">${esc(label)}</p>
        <div class="gallery">${codes.map(placeTile).join('')}</div>`).join('')}

      <button class="btn" data-act="closesheet">${esc(t('close'))}</button>`);
  }

  const placeTile = (code) => `
    <button data-act="pickplace" data-code="${code}">
      <img src="${photoOf(code).src}" alt="">
      <b>${PLACES[code].icon} ${esc(placeName(code))}</b>
      <small>${esc(placeAt(code))}</small>
    </button>`;

  const demoSheet = () => openSheet(`
    <h2>${esc(t('demoTitle'))}</h2>
    <p class="demo-note">${esc(t('demoHint'))}</p>
    <button class="pick" data-act="finish"><span class="pick__icon">✔</span>
      <span><b>${esc(t('demoFinish'))}</b><span>${esc(nextStep() ? nextStep()[state.lang] : '—')}</span></span></button>
    <button class="pick" data-act="lift"><span class="pick__icon">🛗</span>
      <span><b>${esc(state.liftClosed ? t('demoLiftOpen') : t('demoLift'))}</b><span>${esc(t('demoLiftHint'))}</span></span></button>
    <button class="pick" data-act="xray"><span class="pick__icon">📷</span>
      <span><b>${esc(t('demoXray'))}</b><span>${esc(t('demoXrayHint'))}</span></span></button>
    <button class="pick" data-act="gallery"><span class="pick__icon">🏥</span>
      <span><b>${esc(t('galleryOpen'))}</b></span></button>
    <a class="pick" href="map.html"><span class="pick__icon">🗺</span>
      <span><b>${esc(t('mapOpen'))}</b></span></a>
    <a class="pick" href="login.html"><span class="pick__icon">🏠</span>
      <span><b>${esc(t('backHome'))}</b></span></a>
    <button class="pick" data-act="reset"><span class="pick__icon">↻</span>
      <span><b>${esc(t('demoReset'))}</b></span></button>
    <button class="btn" data-act="closesheet">${esc(t('close'))}</button>`);

  function toast(message) {
    el.toast.innerHTML = `<div>${esc(message)}</div>`;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { el.toast.innerHTML = ''; }, 3400);
  }

  const buzz = (pattern) => { try { navigator.vibrate?.(pattern); } catch { /* ไม่รองรับก็ข้ามไป */ } };

  function speak() {
    const route = currentRoute();
    const leg = route[state.solo ? state.leg : 0];
    const text = `${legText(leg)} ${legHint(leg)}`.trim();
    try {
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = langMeta().speech;
      speechSynthesis.speak(utterance);
    } catch {
      toast(text);   // เครื่องที่ไม่มีเสียงของภาษานั้น อย่างน้อยยังอ่านตัวอักษรได้
    }
  }

  const ACTIONS = {
    route: () => { state.view = 'route'; state.leg = 0; },
    steps: () => { state.view = 'steps'; },
    mode: () => { state.solo = !state.solo; state.leg = 0; },
    speak,
    nextleg: () => { state.leg = Math.min(state.leg + 1, currentRoute().length - 1); buzz(12); },
    prevleg: () => { state.leg = Math.max(0, state.leg - 1); },
    where: whereSheet,
    closesheet: () => el.sheet.close(),

    photo: (button) => photoSheet(button.dataset.code),
    gallery: gallerySheet,

    shoot: (button) => {
      pendingPhotoCode = button.dataset.code;
      el.photoFile.click();
    },

    dropphoto: (button) => {
      const code = button.dataset.code;
      delete userPhotos[code];
      savePhotos();
      photoSheet(code);
      toast(t('photoRemoved', { p: placeName(code) }));
    },

    setlang: (button) => {
      state.lang = button.dataset.code;
      save('carepath.lang', state.lang);
      el.sheet.close();
    },

    arrive: () => {
      const target = nextStep();
      state.at = target.point;
      state.atSource = 'manual';
      state.view = 'steps';
      state.rerouteOpen = false;
      buzz([18, 60, 18]);
      toast(t('toastArrive'));
    },

    pickplace: (button) => {
      state.at = button.dataset.code;
      state.atSource = 'manual';
      state.leg = 0;
      el.sheet.close();
      toast(t('toastMoved', { p: placeName(state.at) }));
    },

    finish: () => {
      const target = nextStep();
      if (!target) return el.sheet.close();
      target.status = 'done';
      target.at = null;
      state.at = target.point;
      state.atSource = 'station';
      state.deadlineOpen = false;
      state.view = 'steps';
      state.leg = 0;
      el.sheet.close();
      buzz([18, 60, 18]);
      toast(t('toastDone', { s: target[state.lang] }));
    },

    lift: () => {
      state.liftClosed = !state.liftClosed;
      state.rerouteOpen = state.liftClosed;
      state.leg = 0;
      el.sheet.close();
      buzz(state.liftClosed ? [22, 70, 22] : 12);
      toast(state.liftClosed ? t('toastLift') : t('toastLiftOpen'));
    },

    xray: () => {
      const payIndex = state.steps.findIndex((step) => step.point === 'A1-PAY');
      if (payIndex === -1 || state.steps.some((step) => step.point === 'B1-XR')) return el.sheet.close();
      state.steps.splice(payIndex, 0, { ...XRAY_STEP });
      el.sheet.close();
      buzz([18, 60, 18]);
      toast(t('toastXray'));
    },

    reset: () => {
      const lang = state.lang;
      state = initialState();
      state.lang = lang;
      el.sheet.close();
      toast(t('toastReset'));
    },
  };

  document.addEventListener('click', (event) => {
    const button = event.target.closest('[data-act]');
    if (!button) return;
    ACTIONS[button.dataset.act]?.(button);
    render();
  });

  let pendingPhotoCode = null;

  el.photoFile.addEventListener('change', async (event) => {
    const [file] = event.target.files;
    event.target.value = '';                 // เลือกไฟล์เดิมซ้ำได้
    if (!file || !pendingPhotoCode) return;

    const code = pendingPhotoCode;
    pendingPhotoCode = null;
    try {
      userPhotos[code] = await shrink(file);
      if (!savePhotos()) {
        delete userPhotos[code];
        return toast(t('photoFull'));
      }
      photoSheet(code);
      render();
      toast(t('photoSaved', { p: placeName(code) }));
    } catch {
      toast(t('photoFull'));
    }
  });

  el.langBtn.addEventListener('click', langSheet);
  el.demoBtn.addEventListener('click', demoSheet);
  el.sheet.addEventListener('click', (event) => {
    if (event.target === el.sheet) el.sheet.close();
  });

  el.largeBtn.addEventListener('click', () => {
    const on = document.body.dataset.large !== 'on';
    document.body.dataset.large = on ? 'on' : 'off';
    el.largeBtn.setAttribute('aria-pressed', String(on));
    state.solo = on;
    save('carepath.large', on ? 'on' : 'off');
    render();
  });

  /* ---------- ค่าที่จำไว้ในเครื่องผู้ใช้ ---------- */

  function save(key, value) {
    try { localStorage.setItem(key, value); } catch { /* โหมดส่วนตัวเขียนไม่ได้ ข้ามไป */ }
  }
  function load(key) {
    try { return localStorage.getItem(key); } catch { return null; }
  }

  function savePhotos() {
    try {
      localStorage.setItem('carepath.photos', JSON.stringify(userPhotos));
      return true;
    } catch {
      return false;      // พื้นที่เต็มหรือโหมดส่วนตัว
    }
  }

  try {
    userPhotos = JSON.parse(load('carepath.photos') ?? '{}');
  } catch {
    userPhotos = {};
  }

  // ฟอนต์มาช้ากว่าการวาดครั้งแรก · วาดป้ายใหม่เมื่อฟอนต์พร้อม
  document.fonts?.ready.then(() => { sceneCache.clear(); render(); });

  const savedLang = load('carepath.lang');
  if (LANGS.some((lang) => lang.code === savedLang)) state.lang = savedLang;
  else {
    const browser = (navigator.language ?? '').slice(0, 2);
    if (LANGS.some((lang) => lang.code === browser)) state.lang = browser;
  }

  if (load('carepath.large') === 'on') {
    document.body.dataset.large = 'on';
    el.largeBtn.setAttribute('aria-pressed', 'true');
    state.solo = true;
  }

  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  if (code && !code.toUpperCase().startsWith('A017')) {
    setTimeout(() => toast(t('codeUnknown', { c: code.toUpperCase() })), 400);
  } else if (params.get('by')) {
    // เปิดจากหลังบ้าน — บอกผู้ป่วยตรง ๆ ว่าใครเป็นคนเปิดและมีการบันทึกไว้
    setTimeout(() => toast(t('openedByStaff')), 400);
  }

  render();
})();
</script>
